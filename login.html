<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KEPO Murid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4 text-center">
            <h4 class="fw-bold mb-1">KEPO Murid</h4>
            <p class="text-muted small mb-4">Sistem Rekap Pelanggaran Siswa</p>
            
            <form id="form-login">
              <div class="mb-3 text-start">
                <label class="form-label small fw-bold">Username</label>
                <input type="text" id="login-username" class="form-control" placeholder="Masukkan username" required>
              </div>
              <div class="mb-3 text-start">
                <label class="form-label small fw-bold">Password</label>
                <input type="password" id="login-password" class="form-control" placeholder="Masukkan password" required>
              </div>
              <button type="submit" id="btn-login" class="btn btn-primary w-100 py-2 fw-semibold">Masuk</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Auth.redirectIfLoggedIn();

      document.getElementById("form-login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-login");
        btn.disabled = true;
        btn.innerText = "Memproses...";

        const u = document.getElementById("login-username").value;
        const p = document.getElementById("login-password").value;

        const res = await Auth.handleLogin(u, p);
        if (res.status === "success") {
          window.location.href = "index.html";
        } else {
          alert(res.message);
          btn.disabled = false;
          btn.innerText = "Masuk";
        }
      });
    });
  </script>
</body>
</html>
