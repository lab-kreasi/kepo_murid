<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KEPO Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <!-- Login Card Container -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/80 p-6 sm:p-8 md:p-10">
    
    <!-- Header Logo & Branding -->
    <div class="flex flex-col items-center text-center mb-6 sm:mb-8">
      <div class="w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-extrabold text-2xl shadow-lg shadow-blue-500/30 mb-3">
        K
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">KEPO Murid</h1>
      <p class="text-xs font-medium text-slate-500 mt-1">Sistem Kedisiplinan & Rekap Poin</p>
    </div>

    <!-- Alert Message Container (Tampil jika username/password salah) -->
    <div id="alert-error" class="hidden mb-5 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-600 text-xs font-semibold flex items-center gap-2.5">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span id="alert-error-text">Username atau password salah.</span>
    </div>

    <!-- Form Login -->
    <form id="form-login" onsubmit="handleLoginSubmit(event)" autocomplete="on">
      <!-- Username Field -->
      <div class="mb-4">
        <label for="login-username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Username</label>
        <input type="text" id="login-username" name="username" autocomplete="username" autofocus class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-slate-800" placeholder="Masukkan username" required>
      </div>

      <!-- Password Field -->
      <div class="mb-6">
        <label for="login-password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password</label>
        <div class="relative">
          <input type="password" id="login-password" name="password" autocomplete="current-password" class="w-full pl-4 pr-11 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-slate-800" placeholder="Masukkan password" required>
          
          <!-- Toggle Mata (Lihat Password) -->
          <button type="button" id="btn-toggle-password" aria-label="Tampilkan Password" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition p-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="btn-login" class="w-full py-3 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold shadow-md shadow-blue-500/25 transition duration-200 cursor-pointer text-sm flex items-center justify-center gap-2">
        <span id="btn-text">Masuk</span>
      </button>
    </form>
    
  </div>

  <!-- JavaScript Dependencies -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // 1. Fitur Toggle Show/Hide Password
    const passwordInput = document.getElementById("login-password");
    const togglePasswordBtn = document.getElementById("btn-toggle-password");
    
    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener("click", () => {
        const isPassword = passwordInput.getAttribute("type") === "password";
        passwordInput.setAttribute("type", isPassword ? "text" : "password");
        togglePasswordBtn.classList.toggle("text-blue-600");
      });
    }

    // 2. Handler Submit Form Login Utama
    async function handleLoginSubmit(event) {
      if (event) event.preventDefault(); // Mencegah reload halaman bawaan browser & hilangkan tanda '?'

      const btn = document.getElementById("btn-login");
      const btnText = document.getElementById("btn-text");
      const alertError = document.getElementById("alert-error");
      const alertText = document.getElementById("alert-error-text");

      // Sembunyikan alert error lama
      alertError.classList.add("hidden");

      // Ubah Tombol ke Mode Loading
      btn.disabled = true;
      btn.classList.add("opacity-80", "cursor-not-allowed");
      btnText.innerHTML = `
        <svg class="animate-spin h-4 w-4 text-white inline-block mr-1.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Memproses...
      `;

      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value.trim();

      try {
        const res = await Auth.handleLogin(username, password);

        if (res && res.status === "success") {
          // DETEKSI REDIRECT DINAMIS BERDASARKAN ROLE
          // Admin -> index.html | User/Piket -> input-pelanggaran.html | Guru -> laporan.html
          const user = Auth.getUserSession();
          const role = user && user.role ? String(user.role).toLowerCase().trim() : "guru";
          const targetPage = Auth.DEFAULT_PAGE[role] || "laporan.html";
          
          window.location.href = targetPage;
        } else {
          // Tampilkan Notifikasi Error
          alertText.textContent = res ? res.message : "Username atau password salah.";
          alertError.classList.remove("hidden");
          
          // Kembalikan Tombol ke Mode Normal
          btn.disabled = false;
          btn.classList.remove("opacity-80", "cursor-not-allowed");
          btnText.innerText = "Masuk";
        }
      } catch (err) {
        alertText.textContent = "Terjadi kesalahan jaringan/sistem. Silakan coba lagi.";
        alertError.classList.remove("hidden");
        
        btn.disabled = false;
        btn.classList.remove("opacity-80", "cursor-not-allowed");
        btnText.innerText = "Masuk";
      }
    }
  </script>
</body>
</html>
