<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KEPO Murid</title>

  <!-- Anti-Flicker CSS -->
  <style>
    html:not(.auth-verified) body { display: none !important; }
  </style>

  <!-- Script Core Proteksi & Autentikasi -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Proteksi Halaman Login & Buka Tampilan (Anti-Flicker)
    document.addEventListener("DOMContentLoaded", () => {
      try {
        // Jika user sudah memiliki sesi valid, langsung arahkan ke halaman rolenya
        if (typeof Auth !== "undefined" && typeof Auth.getUser === "function") {
          const user = Auth.getUser();
          if (user && user.role) {
            const role = String(user.role).toLowerCase().trim();
            const defaultPages = {
              admin: "index.html",
              user: "index.html",
              piket: "index.html",
              guru: "laporan.html"
            };
            const target = (Auth.DEFAULT_PAGE && Auth.DEFAULT_PAGE[role]) || defaultPages[role] || "index.html";
            window.location.replace(target);
            return;
          }
        }
      } catch (err) {
        console.warn("Gagal mengecek sesi login awal:", err);
      }

      // Tampilkan halaman login jika user belum login
      document.documentElement.classList.add("auth-verified");
    });
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-800">KEPO Murid</h1>
      <p class="text-sm text-slate-500 mt-1">Sistem Catatan Pelanggaran & Prestasi</p>
    </div>

    <!-- Alert Pesan Error -->
    <div id="login-error" class="hidden mb-4 p-3 rounded-lg bg-red-50 text-red-600 text-sm border border-red-200"></div>

    <form id="form-login" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          required 
          autocomplete="username"
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
          placeholder="Masukkan username"
        >
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          autocomplete="current-password"
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
          placeholder="Masukkan password"
        >
      </div>

      <button 
        type="submit" 
        id="btn-submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md flex justify-center items-center"
      >
        <span>Masuk</span>
      </button>
    </form>
  </div>

  <script>
    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();

      const errorEl = document.getElementById("login-error");
      const btnSubmit = document.getElementById("btn-submit");
      const usernameInput = document.getElementById("username").value.trim();
      const passwordInput = document.getElementById("password").value.trim();

      // Sembunyikan error lama & ubah status tombol
      errorEl.classList.add("hidden");
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<span>Memproses...</span>`;

      try {
        const res = await Auth.handleLogin(usernameInput, passwordInput);

        if (res && res.status === "success") {
          // Ambil role dari response API
          const rawRole = res.data && res.data.role ? res.data.role : "guru";
          const role = String(rawRole).toLowerCase().trim();

          // Map halaman tujuan berdasarkan hak akses role
          const defaultPages = {
            admin: "index.html",
            user: "index.html",
            piket: "index.html",
            guru: "laporan.html"
          };

          const targetPage = (Auth.DEFAULT_PAGE && Auth.DEFAULT_PAGE[role]) 
            || defaultPages[role] 
            || "laporan.html";
          
          // Alihkan ke halaman tujuan
          window.location.replace(targetPage);
        } else {
          errorEl.textContent = (res && res.message) ? res.message : "Username atau password salah!";
          errorEl.classList.remove("hidden");
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = `<span>Masuk</span>`;
        }
      } catch (err) {
        console.error("[Login Form Error]", err);
        errorEl.textContent = "Terjadi kesalahan koneksi ke server.";
        errorEl.classList.remove("hidden");
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<span>Masuk</span>`;
      }
    });
  </script>
</body>
</html>
