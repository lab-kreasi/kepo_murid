<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KEPO Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <!-- Login Card Container -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/80 p-8 md:p-10">
    
    <!-- Header Logo & Branding -->
    <div class="flex flex-col items-center text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-extrabold text-2xl shadow-lg shadow-blue-500/30 mb-4">
        K
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">KEPO Murid</h1>
      <p class="text-xs font-medium text-slate-500 mt-1">Sistem Rekap Pelanggaran Siswa</p>
    </div>

    <!-- Form Login -->
    <form id="form-login">
      <!-- Username Field -->
      <div class="mb-5">
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Username</label>
        <input type="text" id="login-username" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-slate-800" placeholder="Masukkan username" required>
      </div>

      <!-- Password Field -->
      <div class="mb-6">
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password</label>
        <input type="password" id="login-password" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-slate-800" placeholder="Masukkan password" required>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="btn-login" class="w-full py-3 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow-md shadow-blue-500/25 transition duration-200 cursor-pointer text-sm">
        Masuk
      </button>
    </form>
    
  </div>

  <!-- JavaScript Dependencies -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Auth.redirectIfLoggedIn();

      document.getElementById("form-login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-login");
        btn.disabled = true;
        btn.innerText = "Memproses...";

        const u = document.getElementById("login-username").value;
        const p = document.getElementById("login-password").value;

        const res = await Auth.handleLogin(u, p);
        if (res.status === "success") {
          window.location.href = "index.html";
        } else {
          alert(res.message);
          btn.disabled = false;
          btn.innerText = "Masuk";
        }
      });
    });
  </script>
</body>
</html>
