<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catat Prestasi - KEPO Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex">

  <!-- Sidebar Container (Di-render otomatis via js/components.js) -->
  <aside id="sidebar-container" class="w-64 flex-shrink-0"></aside>

  <!-- Main Content Area -->
  <main class="flex-1 p-6 md:p-8 min-w-0">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pb-4 border-b border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Pencatatan Prestasi Siswa</h1>
        <p class="text-sm text-emerald-600 font-medium mt-0.5">Prestasi akan mengurangi total poin pelanggaran siswa.</p>
      </div>
      <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold rounded-xl transition w-fit">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span>Kembali ke Dashboard</span>
      </a>
    </div>

    <!-- Form Card Container -->
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
      <form id="form-catat-prestasi" onsubmit="submitCatatanPrestasi(event)">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
          <!-- Tanggal -->
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Tanggal</label>
            <input type="date" id="input-tanggal-prestasi" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm text-slate-800" required>
          </div>

          <!-- Filter Kelas -->
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Filter Kelas</label>
            <input type="text" id="select-kelas-prestasi" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm text-slate-800" placeholder="Ketik Kelas..." oninput="loadSiswaPrestasi()">
          </div>
        </div>

        <!-- Pilih Siswa -->
        <div class="mb-5">
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Pilih Siswa</label>
          <select id="select-siswa-prestasi" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm text-slate-800" required>
            <option value="">-- Pilih Siswa --</option>
          </select>
        </div>

        <!-- Pilih Prestasi -->
        <div class="mb-6">
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
            Pilih Prestasi
          </label>
          <div id="container-checkbox-prestasi" class="border border-slate-300 rounded-xl p-4 bg-slate-50 max-h-60 overflow-y-auto space-y-2 text-sm text-slate-700">
            <!-- Checkbox di-render via js -->
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full py-3 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-md shadow-emerald-500/20 transition duration-200 cursor-pointer text-sm">
          Simpan Catatan Prestasi
        </button>

      </form>
    </div>
  </main>

  <!-- Script Files -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/input-prestasi.js"></script>
</body>
</html>
