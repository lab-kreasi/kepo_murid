<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catat Prestasi - KEPO Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col md:flex-row relative overflow-x-hidden">

  <!-- Mobile Top Bar (Tampil khusus layar HP) -->
  <header class="md:hidden bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-sm">
    <div class="flex items-center gap-3">
      <button id="mobile-menu-btn" aria-label="Buka Menu" class="p-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 focus:outline-none transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <span class="font-bold text-slate-900 text-base">KEPO Murid</span>
    </div>
    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/60">
      Prestasi
    </span>
  </header>

  <!-- Overlay Latar Belakang saat Sidebar Mobile Terbuka -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden md:hidden transition-opacity duration-300"></div>

  <!-- Sidebar Container (Slide-in di Mobile, Permanent di Desktop) -->
  <aside id="sidebar-container" class="fixed md:sticky top-0 inset-y-0 left-0 z-50 w-64 h-screen bg-slate-900 border-r border-slate-800 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex-shrink-0 overflow-y-auto">
    <!-- Di-render otomatis via js/components.js -->
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 p-4 sm:p-6 lg:p-8 min-w-0 w-full">
    <!-- Header Page -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 sm:mb-8 pb-4 border-b border-slate-200">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Pencatatan Prestasi Siswa</h1>
        <p class="text-xs sm:text-sm text-emerald-600 font-medium mt-0.5">Prestasi akan menambah poin kebaikan / mengurangi akumulasi pelanggaran siswa.</p>
      </div>
      <a href="index.html" class="inline-flex items-center gap-2 px-3.5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs sm:text-sm font-semibold rounded-xl transition w-fit">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span>Kembali ke Dashboard</span>
      </a>
    </div>

    <!-- Form Card Container -->
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-6 md:p-8">
      <form id="form-catat-prestasi" onsubmit="submitCatatanPrestasi(event)">
        
        <!-- Form Grid: Tanggal & Filter Kelas -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5 mb-4 sm:mb-5">
          <!-- Tanggal -->
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Tanggal</label>
            <input type="date" id="input-tanggal-prestasi" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm text-slate-800" required>
          </div>

          <!-- Dropdown Filter Kelas -->
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Pilih Kelas</label>
            <select id="select-kelas-prestasi" onchange="onKelasChangePrestasi()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm text-slate-800 cursor-pointer">
              <option value="">-- Memuat Kelas... --</option>
            </select>
          </div>
        </div>

        <!-- Smart Searchbox Pilih Siswa -->
        <div class="mb-4 sm:mb-5 relative" id="siswa-prestasi-searchbox-container">
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
            Pilih Siswa <span class="text-slate-400 font-normal lowercase">(ketik nama / NISN)</span>
          </label>

          <!-- Input Tersembunyi untuk ID Siswa -->
          <input type="hidden" id="select-siswa-prestasi" required>

          <!-- Input Teks Search -->
          <div class="relative">
            <input type="text" 
                   id="input-search-siswa-prestasi" 
                   class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm text-slate-800 pr-10" 
                   placeholder="Ketik nama atau NISN siswa..." 
                   autocomplete="off"
                   oninput="onSiswaSearchInput(this.value)"
                   onfocus="showSiswaDropdown()">
            
            <!-- Tombol Clear (X) -->
            <button type="button" id="btn-clear-siswa-prestasi" onclick="clearSelectedSiswa()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
          </div>

          <!-- Popup List Hasil Pencarian -->
          <div id="dropdown-siswa-prestasi-results" class="hidden absolute z-30 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-xl max-h-60 overflow-y-auto divide-y divide-slate-100">
            <!-- Di-render otomatis via js -->
          </div>
        </div>

        <!-- Pilih Jenis Prestasi -->
        <div class="mb-5 sm:mb-6">
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
            Pilih Prestasi <span class="text-slate-400 font-normal lowercase">(bisa pilih lebih dari satu)</span>
          </label>
          <div id="container-checkbox-prestasi" class="border border-slate-300 rounded-xl p-3.5 sm:p-4 bg-slate-50 max-h-60 overflow-y-auto space-y-2 text-sm text-slate-700">
            <!-- Checkbox di-render via input-prestasi.js -->
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full py-3 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold shadow-md shadow-emerald-500/20 transition duration-200 cursor-pointer text-sm">
          Simpan Catatan Prestasi
        </button>

      </form>
    </div>
  </main>

  <!-- Script Interaktivitas Drawer / Off-canvas Mobile -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const mobileMenuBtn = document.getElementById("mobile-menu-btn");
      const sidebar = document.getElementById("sidebar-container");
      const overlay = document.getElementById("sidebar-overlay");

      function toggleSidebar() {
        const isHidden = sidebar.classList.contains("-translate-x-full");
        if (isHidden) {
          sidebar.classList.remove("-translate-x-full");
          overlay.classList.remove("hidden");
        } else {
          sidebar.classList.add("-translate-x-full");
          overlay.classList.add("hidden");
        }
      }

      if (mobileMenuBtn && sidebar && overlay) {
        mobileMenuBtn.addEventListener("click", toggleSidebar);
        overlay.addEventListener("click", toggleSidebar);
      }
    });
  </script>

  <!-- Script Files -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/input-prestasi.js"></script>
</body>
</html>
