<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan & Ranking - KEPO Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print, aside, #sidebar-container { display: none !important; }
      main { margin-left: 0 !important; padding: 0 !important; width: 100% !important; }
      .card-box { box-shadow: none !important; border: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex">

  <!-- Sidebar Container (Di-render otomatis via js/components.js) -->
  <aside id="sidebar-container" class="w-64 flex-shrink-0"></aside>

  <!-- Main Content Area -->
  <main class="flex-1 p-6 md:p-8 min-w-0">
    <!-- Header Controls -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pb-4 border-b border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Laporan Akumulasi Poin Siswa</h1>
        <p class="text-sm text-slate-500 font-medium mt-0.5">Rekapitulasi perbandingan poin pelanggaran, prestasi, dan total akumulasi poin.</p>
      </div>

      <!-- Filter & Export Action Buttons -->
      <div class="flex flex-wrap items-center gap-2.5 no-print w-full sm:w-auto">
        <!-- Filter Kelas -->
        <select id="filter-kelas-laporan" onchange="renderLaporanTable()" class="px-3 py-2 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-xs font-semibold text-slate-700 shadow-sm transition">
          <option value="">Semua Kelas</option>
        </select>

        <!-- Filter Top Limit -->
        <select id="filter-limit" onchange="renderLaporanTable()" class="px-3 py-2 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-xs font-semibold text-slate-700 shadow-sm transition">
          <option value="">Tampilkan Semua</option>
          <option value="10">Top 10</option>
          <option value="20">Top 20</option>
          <option value="50">Top 50</option>
        </select>

        <button onclick="printLaporan()" class="px-4 py-2 bg-slate-700 hover:bg-slate-800 text-white text-xs font-semibold rounded-xl shadow-sm transition flex items-center gap-1.5 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          <span>Cetak PDF</span>
        </button>

        <button onclick="exportToCSV()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl shadow-sm shadow-emerald-500/20 transition flex items-center gap-1.5 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span>Ekspor CSV</span>
        </button>

        <a href="index.html" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-xl transition flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          <span>Dashboard</span>
        </a>
      </div>
    </div>

    <!-- Table Card Container -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 overflow-hidden card-box">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[11px] font-bold tracking-wider">
              <th class="py-3.5 px-4 rounded-l-xl text-center w-16">Peringkat</th>
              <th class="py-3.5 px-4">NIS / NISN</th>
              <th class="py-3.5 px-4">Nama Siswa</th>
              <th class="py-3.5 px-4 text-center">Kelas</th>
              <th class="py-3.5 px-4 text-center">Frekuensi Pelanggaran</th>
              <th class="py-3.5 px-4 text-center text-red-600">Total Poin Pelanggaran</th>
              <th class="py-3.5 px-4 text-center">Frekuensi Prestasi</th>
              <th class="py-3.5 px-4 text-center text-emerald-600">Total Poin Prestasi</th>
              <th class="py-3.5 px-4 rounded-r-xl text-center">Akumulasi Poin</th>
            </tr>
          </thead>
          <tbody id="tbody-laporan" class="divide-y divide-slate-100 text-slate-700 font-medium">
            <!-- Data di-render via js/laporan.js -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- JavaScript Dependencies -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/laporan.js"></script>
</body>
</html>
