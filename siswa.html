<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Siswa - KEPO Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex">

  <!-- Sidebar Container -->
  <aside id="sidebar-container" class="w-64 flex-shrink-0">
    <div class="h-screen w-64 bg-slate-900 text-slate-300 flex flex-col justify-between fixed left-0 top-0 z-50 border-r border-slate-800 shadow-xl">
      <div>
        <div class="p-6 flex items-center gap-3 border-b border-slate-800">
          <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-blue-500/30">
            K
          </div>
          <div>
            <h1 class="text-base font-bold text-white leading-tight">KEPO Murid</h1>
            <p class="text-xs text-slate-400">Sistem Kedisiplinan</p>
          </div>
        </div>

        <nav class="p-4 space-y-1 text-sm">
          <a href="index.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl bg-blue-600 text-white font-medium shadow-md transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span>Dashboard</span>
          </a>

          <div class="pt-3">
            <div class="px-4 text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">Pelanggaran</div>
            <a href="input-pelanggaran.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white text-slate-300 font-medium transition">
              <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
              <span>Input Pelanggaran</span>
            </a>
            <a href="jenis-pelanggaran.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white text-slate-300 font-medium transition">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
              <span>Master Pelanggaran</span>
            </a>
          </div>

          <div class="pt-3">
            <div class="px-4 text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">Prestasi</div>
            <a href="input-prestasi.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white text-slate-300 font-medium transition">
              <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
              <span>Input Prestasi</span>
            </a>
            <a href="jenis-prestasi.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white text-slate-300 font-medium transition">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
              <span>Master Prestasi</span>
            </a>
          </div>

          <div class="pt-3">
            <div class="px-4 text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">Lainnya</div>
            <a href="siswa.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white text-slate-300 font-medium transition">
              <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
              <span>Data Siswa</span>
            </a>
            <a href="laporan.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white text-slate-300 font-medium transition">
              <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              <span>Laporan</span>
            </a>
          </div>
        </nav>
      </div>

      <div class="p-4 border-t border-slate-800">
        <button onclick="Auth.logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-red-600/20 hover:text-red-400 text-slate-300 font-medium transition text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
          <span>Keluar</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 p-6 md:p-10 ml-0 md:ml-64 transition-all">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8 pb-4 border-b border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Kelola Data Siswa</h1>
        <p class="text-sm text-slate-500 font-medium">Manajemen identitas, kelas, dan status aktif siswa.</p>
      </div>
    </div>

    <!-- Layout Grid (Form Input + Tabel Data) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Form Input / Edit Siswa (Left Column) -->
      <div class="lg:col-span-4">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sticky top-6">
          <h2 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">Form Data Siswa</h2>
          
          <form id="form-siswa" onsubmit="handleSaveSiswa(event)">
            <input type="hidden" id="siswa-id">

            <!-- NIS -->
            <div class="mb-4">
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">NIS</label>
              <input type="text" id="siswa-nis" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-slate-800" placeholder="Masukkan NIS..." required>
            </div>

            <!-- Nama Lengkap -->
            <div class="mb-4">
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Nama Lengkap</label>
              <input type="text" id="siswa-nama" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-slate-800" placeholder="Masukkan nama siswa..." required>
            </div>

            <!-- Kelas -->
            <div class="mb-4">
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Kelas</label>
              <input type="text" id="siswa-kelas" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-slate-800" placeholder="Contoh: VII.1" required>
            </div>

            <!-- Status -->
            <div class="mb-6">
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Status</label>
              <select id="siswa-status" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-slate-800">
                <option value="Aktif">Aktif</option>
                <option value="Non-Aktif">Non-Aktif</option>
              </select>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-2">
              <button type="submit" class="flex-1 py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow-md shadow-blue-500/20 transition duration-200 cursor-pointer text-sm">
                Simpan
              </button>
              <button type="button" onclick="resetSiswaForm()" class="py-3 px-4 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold transition duration-200 cursor-pointer text-sm">
                Reset
              </button>
            </div>

          </form>
        </div>
      </div>

      <!-- Tabel Data Siswa (Right Column) -->
      <div class="lg:col-span-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 overflow-hidden">
          
          <!-- Filters Row -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
            <div>
              <input type="text" id="search-siswa" oninput="loadDataSiswa()" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition text-sm text-slate-800" placeholder="Cari Nama / NIS...">
            </div>
            <div>
              <input type="text" id="filter-kelas" oninput="loadDataSiswa()" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition text-sm text-slate-800" placeholder="Filter Kelas...">
            </div>
          </div>

          <!-- Table -->
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[11px] font-bold tracking-wider">
                  <th class="py-3.5 px-4 rounded-l-xl w-12 text-center">#</th>
                  <th class="py-3.5 px-4">NIS</th>
                  <th class="py-3.5 px-4">Nama</th>
                  <th class="py-3.5 px-4">Kelas</th>
                  <th class="py-3.5 px-4 text-center">Status</th>
                  <th class="py-3.5 px-4 rounded-r-xl text-center w-32">Aksi</th>
                </tr>
              </thead>
              <tbody id="tbody-siswa" class="divide-y divide-slate-100 text-slate-700 font-medium">
                <!-- Data di-render via siswa.js -->
              </tbody>
            </table>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- JavaScript Dependencies -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/siswa.js"></script>
</body>
</html>
