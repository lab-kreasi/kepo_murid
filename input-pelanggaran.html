<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catat Pelanggaran - KEPO Murid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">KEPO Murid</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="input-pelanggaran.html">Catat Pelanggaran</a></li>
          <li class="nav-item"><a class="nav-link" href="siswa.html">Data Siswa</a></li>
          <li class="nav-item"><a class="nav-link" href="jenis-pelanggaran.html">Jenis Pelanggaran</a></li>
          <li class="nav-item"><a class="nav-link" href="laporan.html">Laporan</a></li>
        </ul>
        <div class="d-flex align-items-center text-white gap-3">
          <span id="nav-user-name" class="small fw-semibold"></span>
          <button class="btn btn-outline-light btn-sm" onclick="Auth.logout()">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h5 class="fw-bold mb-3">Pencatatan Pelanggaran Siswa</h5>
            <form id="form-catat-lengkap" onsubmit="submitFullCatatan(event)">
              
              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Tanggal</label>
                  <input type="date" id="input-tanggal" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Filter Kelas</label>
                  <input type="text" id="select-kelas" class="form-control" placeholder="Ketik Kelas untuk memfilter..." oninput="loadMasterSiswa()">
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label small fw-bold">Pilih Siswa</label>
                <select id="select-siswa" class="form-select" required>
                  <option value="">-- Pilih Siswa --</option>
                </select>
              </div>

              <div class="mb-4">
                <label class="form-label small fw-bold">Pilih Pelanggaran (Bisa Pilih Lebih dari Satu)</label>
                <div id="container-checkbox-pelanggaran" class="border rounded p-3 bg-white" style="max-height: 200px; overflow-y: auto;">
                  <!-- Checkbox di-render via input.js -->
                </div>
              </div>

              <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Simpan Catatan Pelanggaran</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/input.js"></script>
</body>
</html>
