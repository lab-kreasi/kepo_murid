<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catat Pelanggaran - KEPO Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex">

  <!-- Sidebar Container (Di-render otomatis via js/components.js) -->
  <aside id="sidebar-container" class="w-64 flex-shrink-0"></aside>

  <!-- Main Content Area -->
  <main class="flex-1 p-6 md:p-8 min-w-0">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pb-4 border-b border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Pencatatan Pelanggaran Siswa</h1>
        <p class="text-sm text-slate-500 font-medium mt-0.5">Formulir input pelanggaran kedisiplinan siswa.</p>
      </div>
      <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold rounded-xl transition w-fit">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span>Kembali ke Dashboard</span>
      </a>
    </div>

    <!-- Form Card Container -->
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
      <form id="form-catat-lengkap" onsubmit="submitFullCatatan(event)">
        
        <!-- Form Grid: Tanggal & Filter Kelas -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
          <!-- Tanggal -->
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Tanggal</label>
            <input type="date" id="input-tanggal" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition text-sm text-slate-800" required>
          </div>
        
          <!-- Filter Kelas (Dropdown Otomatis) -->
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Pilih Kelas</label>
            <select id="select-kelas" onchange="onKelasChange()" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition text-sm text-slate-800 cursor-pointer">
              <option value="">-- Memuat Kelas... --</option>
            </select>
          </div>
        </div>

        <!-- Smart Searchbox Pilih Siswa -->
        <div class="mb-5 relative" id="siswa-searchbox-container">
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
            Pilih Siswa <span class="text-slate-400 font-normal lowercase">(ketik nama / NISN)</span>
          </label>
        
          <!-- Input Tersembunyi untuk Form Submit -->
          <input type="hidden" id="select-siswa" required>
        
          <!-- Input Teks Search -->
          <div class="relative">
            <input type="text" 
                   id="input-search-siswa" 
                   class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition text-sm text-slate-800 pr-10" 
                   placeholder="Ketik nama atau NISN siswa..." 
                   autocomplete="off"
                   oninput="onSiswaSearchInput(this.value)"
                   onfocus="showSiswaDropdown()">
            
            <!-- Tombol Clear (X) -->
            <button type="button" id="btn-clear-siswa" onclick="clearSelectedSiswa()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
          </div>
        
          <!-- Popup List Hasil Pencarian (Dropdown Custom) -->
          <div id="dropdown-siswa-results" class="hidden absolute z-30 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-xl max-h-60 overflow-y-auto divide-y divide-slate-100">
            <!-- Di-render otomatis via input.js -->
          </div>
        </div>

        <!-- Pilih Pelanggaran -->
        <div class="mb-6">
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
            Pilih Pelanggaran <span class="text-slate-400 font-normal lowercase">(bisa pilih lebih dari satu)</span>
          </label>
          <div id="container-checkbox-pelanggaran" class="border border-slate-300 rounded-xl p-4 bg-slate-50 max-h-60 overflow-y-auto space-y-2 text-sm text-slate-700">
            <!-- Checkbox di-render via input.js -->
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full py-3 px-6 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold shadow-md shadow-red-500/20 transition duration-200 cursor-pointer text-sm">
          Simpan Catatan Pelanggaran
        </button>

      </form>
    </div>
  </main>

  <!-- Script Files -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/input.js"></script>
</body>
</html>
