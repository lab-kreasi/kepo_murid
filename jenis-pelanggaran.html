<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jenis Pelanggaran - KEPO Murid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">KEPO Murid</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="input-pelanggaran.html">Catat Pelanggaran</a></li>
          <li class="nav-item"><a class="nav-link" href="siswa.html">Data Siswa</a></li>
          <li class="nav-item"><a class="nav-link active" href="jenis-pelanggaran.html">Jenis Pelanggaran</a></li>
          <li class="nav-item"><a class="nav-link" href="laporan.html">Laporan</a></li>
        </ul>
        <div class="d-flex align-items-center text-white gap-3">
          <span id="nav-user-name" class="small fw-semibold"></span>
          <button class="btn btn-outline-light btn-sm" onclick="Auth.logout()">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row">
      <!-- Form Input / Edit Pelanggaran -->
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h5 class="fw-bold mb-3">Master Pelanggaran</h5>
            <form id="form-pelanggaran" onsubmit="handleSavePelanggaran(event)">
              <input type="hidden" id="pelanggaran-id">
              <div class="mb-3">
                <label class="form-label small">Nama / Jenis Pelanggaran</label>
                <input type="text" id="pelanggaran-jenis" class="form-control" placeholder="Contoh: Datang Terlambat" required>
              </div>
              <div class="mb-3">
                <label class="form-label small">Bobot Poin</label>
                <input type="number" id="pelanggaran-poin" class="form-control" min="1" placeholder="Contoh: 5" required>
              </div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-fill">Simpan</button>
                <button type="button" class="btn btn-secondary" onclick="resetPelanggaranForm()">Reset</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Tabel Master Pelanggaran -->
      <div class="col-md-8">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>Jenis Pelanggaran</th>
                    <th>Bobot Poin</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody id="tbody-pelanggaran">
                  <!-- Data di-render via pelanggaran.js -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pelanggaran.js"></script>
</body>
</html>
