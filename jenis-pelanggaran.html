<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jenis Pelanggaran - KEPO Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex">

  <!-- Sidebar Container (Di-render otomatis via js/components.js) -->
  <aside id="sidebar-container" class="w-64 flex-shrink-0"></aside>

  <!-- Main Content Area -->
  <main class="flex-1 p-6 md:p-8 min-w-0">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pb-4 border-b border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Master Jenis Pelanggaran</h1>
        <p class="text-sm text-slate-500 font-medium mt-0.5">Kelola daftar jenis pelanggaran dan bobot poin pelanggaran.</p>
      </div>
      <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold rounded-xl transition w-fit">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span>Kembali ke Dashboard</span>
      </a>
    </div>

    <!-- Layout Grid (Form Input + Tabel) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Form Input / Edit Pelanggaran (Left Column) -->
      <div class="lg:col-span-4">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sticky top-6">
          <h2 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">Form Master Pelanggaran</h2>
          
          <form id="form-pelanggaran" onsubmit="handleSavePelanggaran(event)">
            <input type="hidden" id="pelanggaran-id">

            <!-- Nama / Jenis Pelanggaran -->
            <div class="mb-4">
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Nama / Jenis Pelanggaran</label>
              <input type="text" id="pelanggaran-jenis" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-slate-800" placeholder="Contoh: Datang Terlambat" required>
            </div>

            <!-- Bobot Poin -->
            <div class="mb-6">
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Bobot Poin</label>
              <input type="number" id="pelanggaran-poin" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-slate-800" min="1" placeholder="Contoh: 5" required>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-2">
              <button type="submit" id="btn-submit-pelanggaran" class="flex-1 py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md shadow-blue-500/20 transition duration-200 cursor-pointer text-sm">
                Simpan
              </button>
              <button type="button" onclick="resetPelanggaranForm()" class="py-2.5 px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl transition duration-200 cursor-pointer text-sm">
                Reset
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Tabel Master Pelanggaran (Right Column) -->
      <div class="lg:col-span-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[11px] font-bold tracking-wider">
                  <th class="py-3.5 px-4 rounded-l-xl w-12 text-center">#</th>
                  <th class="py-3.5 px-4">Jenis Pelanggaran</th>
                  <th class="py-3.5 px-4 w-32 text-center">Bobot Poin</th>
                  <th class="py-3.5 px-4 rounded-r-xl w-32 text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="tbody-pelanggaran" class="divide-y divide-slate-100 text-slate-700 font-medium">
                <tr>
                  <td colspan="4" class="py-8 text-center text-slate-400 font-normal">
                    <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-blue-600 border-t-transparent mb-2"></div>
                    <p class="text-xs">Membaca data dari spreadsheet...</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- JavaScript Dependencies -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pelanggaran.js"></script>
</body>
</html>
