<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jenis Pelanggaran - KEPO Murid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Tempat Inject Navbar Toolbar -->
  <div id="toolbar-container"></div>

  <div class="container mt-4">
    <div class="row">
      <!-- Form Input / Edit Pelanggaran -->
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h5 class="fw-bold mb-3">Master Pelanggaran</h5>
            <form id="form-pelanggaran" onsubmit="handleSavePelanggaran(event)">
              <input type="hidden" id="pelanggaran-id">
              <div class="mb-3">
                <label class="form-label small">Nama / Jenis Pelanggaran</label>
                <input type="text" id="pelanggaran-jenis" class="form-control" placeholder="Contoh: Datang Terlambat" required>
              </div>
              <div class="mb-3">
                <label class="form-label small">Bobot Poin</label>
                <input type="number" id="pelanggaran-poin" class="form-control" min="1" placeholder="Contoh: 5" required>
              </div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-fill">Simpan</button>
                <button type="button" class="btn btn-secondary" onclick="resetPelanggaranForm()">Reset</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Tabel Master Pelanggaran -->
      <div class="col-md-8">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>Jenis Pelanggaran</th>
                    <th>Bobot Poin</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody id="tbody-pelanggaran">
                  <!-- Data di-render via js/pelanggaran.js -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pelanggaran.js"></script>
</body>
</html>
