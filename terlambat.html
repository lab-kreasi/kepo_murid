<main class="p-6 max-w-7xl mx-auto space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Presensi Terlambat</h1>
      <p class="text-sm text-slate-500">Pilih siswa yang terlambat untuk mencatat poin pelanggaran secara otomatis.</p>
    </div>
    <div class="flex items-center gap-3">
      <label class="text-sm font-semibold text-slate-600">Tanggal:</label>
      <input type="date" id="input-tanggal-terlambat" class="px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
  </div>

  <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
    <div class="flex flex-col sm:flex-row gap-4 justify-between items-center border-b border-slate-100 pb-4">
      <div class="w-full sm:w-64">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Filter Kelas</label>
        <select id="select-kelas-terlambat" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">-- Semua Kelas --</option>
        </select>
      </div>
      <div class="w-full sm:w-auto flex items-center gap-3 self-end">
        <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-slate-700">
          <input type="checkbox" id="check-all-terlambat" class="w-4 h-4 text-blue-600 rounded">
          Pilih Semua
        </label>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="border-b border-slate-200 text-slate-500 font-semibold bg-slate-50">
            <th class="p-3 w-12 text-center">Pilih</th>
            <th class="p-3">NISN / NIS</th>
            <th class="p-3">Nama Siswa</th>
            <th class="p-3">Kelas</th>
          </tr>
        </thead>
        <tbody id="table-siswa-terlambat" class="divide-y divide-slate-100 text-slate-700">
          <tr><td colspan="4" class="text-center py-6 text-slate-400">Memuat data siswa...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="flex justify-end pt-4 border-t border-slate-100">
      <button id="btn-simpan-terlambat" class="px-6 py-2.5 bg-yellow-600 hover:bg-yellow-700 text-white font-semibold rounded-xl shadow-md transition flex items-center gap-2 cursor-pointer">
        <span>Simpan Pelanggaran Terlambat</span>
      </button>
    </div>
  </div>
</main>
