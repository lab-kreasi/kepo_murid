<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - KEPO Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex">

  <!-- Sidebar Container -->
  <aside id="sidebar-container" class="w-64 flex-shrink-0"></aside>

  <!-- Content Container -->
  <main class="flex-1 p-6 md:p-10 ml-0 md:ml-64 transition-all">
    <div class="flex justify-between items-center mb-8 pb-4 border-b border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Dashboard Statistik</h1>
        <p class="text-sm text-slate-500">Ringkasan aktivitas poin kedisiplinan dan prestasi siswa.</p>
      </div>
    </div>

    <!-- Ringkasan Statistik -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
      <div class="bg-blue-600 text-white rounded-2xl p-6 shadow-sm flex flex-col justify-between relative overflow-hidden">
        <p class="text-xs font-semibold tracking-wider uppercase opacity-80 mb-1">Total Siswa</p>
        <h2 id="dash-total-siswa" class="text-4xl font-extrabold">0</h2>
      </div>

      <div class="bg-amber-500 text-white rounded-2xl p-6 shadow-sm flex flex-col justify-between relative overflow-hidden">
        <p class="text-xs font-semibold tracking-wider uppercase opacity-80 mb-1">Pelanggaran Hari Ini</p>
        <h2 id="dash-pelanggaran-hari-ini" class="text-4xl font-extrabold">0</h2>
      </div>

      <div class="bg-emerald-600 text-white rounded-2xl p-6 shadow-sm flex flex-col justify-between relative overflow-hidden">
        <p class="text-xs font-semibold tracking-wider uppercase opacity-80 mb-1">Prestasi Hari Ini</p>
        <h2 id="dash-prestasi-hari-ini" class="text-4xl font-extrabold">0</h2>
      </div>

      <div class="bg-slate-700 text-white rounded-2xl p-6 shadow-sm flex flex-col justify-between relative overflow-hidden">
        <p class="text-xs font-semibold tracking-wider uppercase opacity-80 mb-1">Total Catatan</p>
        <h2 id="dash-total-catatan" class="text-4xl font-extrabold">0</h2>
      </div>
    </div>

    <!-- Akumulasi Poin -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
      <div class="bg-white border-2 border-red-500/30 rounded-2xl p-6 shadow-sm text-center">
        <p class="text-xs font-bold tracking-wider uppercase text-red-600 mb-1">Total Poin Pelanggaran</p>
        <h3 id="dash-poin-pelanggaran" class="text-3xl font-black text-red-600">0</h3>
      </div>

      <div class="bg-white border-2 border-emerald-500/30 rounded-2xl p-6 shadow-sm text-center">
        <p class="text-xs font-bold tracking-wider uppercase text-emerald-600 mb-1">Total Poin Prestasi (Pengurang)</p>
        <h3 id="dash-poin-prestasi" class="text-3xl font-black text-emerald-600">0</h3>
      </div>

      <div class="bg-slate-900 rounded-2xl p-6 shadow-sm text-center">
        <p class="text-xs font-bold tracking-wider uppercase text-amber-400 mb-1">Poin Bersih Kumulatif</p>
        <h3 id="dash-total-poin" class="text-3xl font-black text-amber-400">0</h3>
      </div>
    </div>
  </main>

  <!-- Script Files -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
