<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - KEPO Murid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">KEPO Murid</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="input-pelanggaran.html">Catat Pelanggaran</a></li>
          <li class="nav-item"><a class="nav-link" href="siswa.html">Data Siswa</a></li>
          <li class="nav-item"><a class="nav-link" href="jenis-pelanggaran.html">Jenis Pelanggaran</a></li>
          <li class="nav-item"><a class="nav-link" href="laporan.html">Laporan</a></li>
        </ul>
        <div class="d-flex align-items-center text-white gap-3">
          <span id="nav-user-name" class="small fw-semibold"></span>
          <button class="btn btn-outline-light btn-sm" onclick="Auth.logout()">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold m-0">Dashboard Statistik</h4>
    </div>

    <!-- Ringkasan Data -->
    <div class="row mb-4">
      <div class="col-md-3">
        <div class="card bg-primary text-white border-0 shadow-sm">
          <div class="card-body text-center">
            <h6 class="text-uppercase fw-bold small">Total Siswa</h6>
            <h2 id="dash-total-siswa" class="fw-bold mb-0">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card bg-warning text-dark border-0 shadow-sm">
          <div class="card-body text-center">
            <h6 class="text-uppercase fw-bold small">Pelanggaran Hari Ini</h6>
            <h2 id="dash-pelanggaran-hari-ini" class="fw-bold mb-0">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card bg-danger text-white border-0 shadow-sm">
          <div class="card-body text-center">
            <h6 class="text-uppercase fw-bold small">Total Poin Kumulatif</h6>
            <h2 id="dash-total-poin" class="fw-bold mb-0">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card bg-success text-white border-0 shadow-sm">
          <div class="card-body text-center">
            <h6 class="text-uppercase fw-bold small">Total Catatan</h6>
            <h2 id="dash-total-catatan" class="fw-bold mb-0">0</h2>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
