<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Catatan Pelanggaran Siswa</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header -->
    <header class="bg-white p-6 rounded-xl shadow-md flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">Catatan Pelanggaran Siswa</h1>
        <p class="text-sm text-slate-500">Sistem Pencatatan Poin Pelanggaran Real-time</p>
      </div>
      <span id="status-badge" class="px-3 py-1 text-xs font-semibold text-yellow-800 bg-yellow-100 rounded-full">
        Memuat Data...
      </span>
    </header>

    <!-- Form Input Pelanggaran -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 class="text-lg font-semibold text-slate-700 mb-4 border-b pb-2">Input Pelanggaran Baru</h2>
      
      <form id="form-pelanggaran" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Tanggal -->
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Tanggal Kejadian</label>
            <input type="date" id="tanggal" required class="w-full border border-slate-300 p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>

          <!-- Pilih Siswa -->
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Pilih Siswa</label>
            <select id="siswa_id" required class="w-full border border-slate-300 p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="">-- Pilih Siswa --</option>
            </select>
          </div>
        </div>

        <!-- Pilih Jenis Pelanggaran (Checkbox List) -->
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-2">Jenis Pelanggaran</label>
          <div id="container-pelanggaran" class="grid grid-cols-1 md:grid-cols-2 gap-2 border border-slate-200 p-3 rounded-lg max-h-48 overflow-y-auto">
            <p class="text-sm text-slate-400">Memuat daftar pelanggaran...</p>
          </div>
        </div>

        <!-- Total Poin & Tahun Ajaran -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center bg-slate-50 p-4 rounded-lg">
          <div>
            <label class="block text-xs font-medium text-slate-500">Total Poin Pelanggaran</label>
            <span id="text-total-poin" class="text-2xl font-bold text-red-600">0 Poin</span>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Tahun Ajaran</label>
            <select id="tahun_ajaran" required class="w-full border border-slate-300 p-2 rounded-lg outline-none">
              <option value="2025-2026">2025-2026</option>
            </select>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow">
          Simpan Catatan Pelanggaran
        </button>
      </form>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // GANTI SAMA URL GAS HASIL DEPLOYMENT ANDA
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz0DLwX_mSpg6HT_pRom8RUJCCLfxAYKfSipySe_yzRWndKWGZ_aNhIaYeK__iG_m5z/exec";

    let masterSiswa = [];
    let masterPelanggaran = [];

    // Set Default Tanggal Hari ini
    document.getElementById('tanggal').valueToDate = new Date();
    document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];

    // Load Data awal saat halaman dibuka
    async function initData() {
      try {
        // Fetch Siswa
        const resSiswa = await fetch(`${GAS_API_URL}?action=getSiswa`);
        const jsonSiswa = await resSiswa.json();
        if (jsonSiswa.status === 'success') {
          masterSiswa = jsonSiswa.data;
          renderSelectSiswa();
        }

        // Fetch Jenis Pelanggaran
        const resPelanggaran = await fetch(`${GAS_API_URL}?action=getJenisPelanggaran`);
        const jsonPelanggaran = await resPelanggaran.json();
        if (jsonPelanggaran.status === 'success') {
          masterPelanggaran = jsonPelanggaran.data;
          renderCheckboxPelanggaran();
        }

        document.getElementById('status-badge').className = "px-3 py-1 text-xs font-semibold text-green-800 bg-green-100 rounded-full";
        document.getElementById('status-badge').innerText = "Terhubung ke Database";

      } catch (err) {
        console.error(err);
        document.getElementById('status-badge').className = "px-3 py-1 text-xs font-semibold text-red-800 bg-red-100 rounded-full";
        document.getElementById('status-badge').innerText = "Gagal Memuat Data";
      }
    }

    // Render Dropdown Siswa
    function renderSelectSiswa() {
      const select = document.getElementById('siswa_id');
      select.innerHTML = '<option value="">-- Pilih Siswa --</option>';
      masterSiswa.forEach(s => {
        select.innerHTML += `<option value="${s.id}">${s.nama} (${s.kelas}) - NIS: ${s.nis}</option>`;
      });
    }

    // Render Checkbox Pelanggaran
    function renderCheckboxPelanggaran() {
      const container = document.getElementById('container-pelanggaran');
      container.innerHTML = '';
      masterPelanggaran.forEach(p => {
        container.innerHTML += `
          <label class="flex items-center space-x-2 p-2 hover:bg-slate-100 rounded cursor-pointer text-sm text-slate-700">
            <input type="checkbox" name="pelanggaran" value="${p.id}" data-poin="${p.poin}" onchange="hitungTotalPoin()" class="w-4 h-4 text-indigo-600 rounded">
            <span>${p.jenis} <strong class="text-red-500">(+${p.poin} Poin)</strong></span>
          </label>
        `;
      });
    }

    // Hitung Poin Otomatis saat Checkbox Diubah
    function hitungTotalPoin() {
      const checkboxes = document.querySelectorAll('input[name="pelanggaran"]:checked');
      let total = 0;
      checkboxes.forEach(cb => {
        total += parseInt(cb.getAttribute('data-poin')) || 0;
      });
      document.getElementById('text-total-poin').innerText = `${total} Poin`;
      return total;
    }

    // Handle Submit Form
    document.getElementById('form-pelanggaran').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btnSubmit = document.getElementById('btn-submit');
      const selectedPelanggaran = Array.from(document.querySelectorAll('input[name="pelanggaran"]:checked')).map(cb => cb.value);

      if (selectedPelanggaran.length === 0) {
        alert("Pilih minimal satu jenis pelanggaran!");
        return;
      }

      const payload = {
        tanggal: document.getElementById('tanggal').value,
        siswa_id: document.getElementById('siswa_id').value,
        pelanggaran_ids: selectedPelanggaran,
        total_poin: hitungTotalPoin(),
        tahun_ajaran: document.getElementById('tahun_ajaran').value
      };

      btnSubmit.disabled = true;
      btnSubmit.innerText = "Menyimpan Data...";

      try {
        // Kirim request POST ke GAS
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'addCatatanPelanggaran',
            payload: payload
          })
        });

        const result = await response.json();

        if (result.status === 'success') {
          alert('Data pelanggaran berhasil disimpan!');
          document.getElementById('form-pelanggaran').reset();
          hitungTotalPoin();
        } else {
          alert('Gagal menyimpan: ' + result.message);
        }
      } catch (err) {
        console.error(err);
        alert('Terjadi kesalahan koneksi ke server.');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Simpan Catatan Pelanggaran";
      }
    });

    // Jalankan inisialisasi saat web selesai di-load
    window.onload = initData;
  </script>
</body>
</html>
