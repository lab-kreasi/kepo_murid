<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jenis Prestasi - KEPO Murid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- TODO: Gunakan Navbar standar Anda di sini -->
  <div id="toolbar-container"></div>
  <div class="container mt-4">
    <div class="row">
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h5 class="fw-bold mb-3">Master Prestasi (Pengurang Poin)</h5>
            <form id="form-prestasi" onsubmit="handleSavePrestasi(event)">
              <div class="mb-3">
                <label class="form-label small">Nama Prestasi</label>
                <input type="text" id="prestasi-jenis" class="form-control" placeholder="Contoh: Juara 1 Lomba" required>
              </div>
              <div class="mb-3">
                <label class="form-label small">Bobot Pengurang Poin</label>
                <input type="number" id="prestasi-poin" class="form-control" min="1" placeholder="Contoh: 10" required>
              </div>
              <button type="submit" class="btn btn-success w-100">Simpan Prestasi</button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr><th>#</th><th>Jenis Prestasi</th><th>Pengurang Poin</th><th>Aksi</th></tr>
                </thead>
                <tbody id="tbody-prestasi"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/prestasi.js"></script>
  <script src="js/components.js"></script><!-- Script JS Baru -->
</body>
</html>
