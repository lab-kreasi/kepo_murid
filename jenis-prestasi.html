<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jenis Prestasi - KEPO Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex">

  <!-- Sidebar Container (Di-render otomatis via js/components.js) -->
  <aside id="sidebar-container" class="w-64 flex-shrink-0"></aside>

  <!-- Main Content Area -->
  <main class="flex-1 p-6 md:p-8 min-w-0">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pb-4 border-b border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Master Jenis Prestasi</h1>
        <p class="text-sm text-emerald-600 font-medium mt-0.5">Kelola daftar jenis prestasi dan poin pengurang pelanggaran.</p>
      </div>
      <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold rounded-xl transition w-fit">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span>Kembali ke Dashboard</span>
      </a>
    </div>

    <!-- Layout Grid (Form Input + Tabel) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Form Input / Edit Prestasi (Left Column) -->
      <div class="lg:col-span-4">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sticky top-6">
          <h2 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">Master Prestasi (Pengurang Poin)</h2>
          
          <form id="form-prestasi" onsubmit="handleSavePrestasi(event)">
            <input type="hidden" id="prestasi-id">

            <!-- Nama Prestasi -->
            <div class="mb-4">
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Nama Prestasi</label>
              <input type="text" id="prestasi-jenis" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm text-slate-800" placeholder="Contoh: Juara 1 Lomba" required>
            </div>

            <!-- Bobot Pengurang Poin -->
            <div class="mb-6">
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Bobot Pengurang Poin</label>
              <input type="number" id="prestasi-poin" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm text-slate-800" min="1" placeholder="Contoh: 10" required>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-2">
              <button type="submit" class="flex-1 py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md shadow-emerald-500/20 transition duration-200 cursor-pointer text-sm">
                Simpan Prestasi
              </button>
              <button type="button" onclick="resetPrestasiForm()" class="py-2.5 px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl transition duration-200 cursor-pointer text-sm">
                Reset
              </button>
            </div>

          </form>
        </div>
      </div>

      <!-- Tabel Master Prestasi (Right Column) -->
      <div class="lg:col-span-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[11px] font-bold tracking-wider">
                  <th class="py-3.5 px-4 rounded-l-xl w-12 text-center">#</th>
                  <th class="py-3.5 px-4">Jenis Prestasi</th>
                  <th class="py-3.5 px-4 w-36 text-center">Pengurang Poin</th>
                  <th class="py-3.5 px-4 rounded-r-xl w-32 text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="tbody-prestasi" class="divide-y divide-slate-100 text-slate-700 font-medium">
                <!-- Data di-render via js/prestasi.js -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- JavaScript Dependencies -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/prestasi.js"></script>
</body>
</html>
